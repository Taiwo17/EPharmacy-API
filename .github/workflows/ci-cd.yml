name: CI/CD

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_TEST_NAME: epharmacy_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.DB_TEST_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: NODE_ENV=test npx sequelize-cli db:migrate

      - name: Run tests
        run: npm test
        continue-on-error: false

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: taiwo17/epharmacy-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull taiwo17/epharmacy-backend:latest
            docker run -d --name api --network app-network -p 4000:4000 \
            -e NODE_ENV=production -e PORT=4000 \
            -e DB_HOST=postgres -e DB_PORT=5432 \
            -e DB_USER=postgres -e DB_PASSWORD=postgres -e DB_NAME=epharmacy_dev \
            -e JWT_ACCESS_SECRET=change_me_access_secret \
            -e JWT_REFRESH_SECRET=change_me_refresh_secret \
            taiwo17/epharmacy-backend:latest
